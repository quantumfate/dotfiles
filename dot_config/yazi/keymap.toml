# ~/.config/yazi/keymap.toml
#
# Keybindings are now managed by which-key.yazi — see `init.lua` and
# `require("which-key"):setup()` there. Every binding that used to live in
# this file (z/zoxide, g<loc>, X/extract, F G/yafg, clipboard y/p, diff,
# R b/recycle-bin, restore u, whoosh bookmarks, etc.) was converted to the
# which-key spec, grouped under discoverable prefixes.
#
# Everything not in that spec falls back to yazi's default keymap.
